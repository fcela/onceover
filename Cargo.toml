[workspace]
resolver = "2"
members = [
    "crates/onceover",
    "crates/onceover-core",
    "crates/onceover-deps",
    "crates/onceover-mines",
    "crates/onceover-py",
    "crates/onceover-report",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/fcela/onceover"
readme = "README.md"

[workspace.dependencies]
onceover = { path = "crates/onceover", version = "=0.1.3" }
onceover-core = { path = "crates/onceover-core", version = "=0.1.3" }
onceover-deps = { path = "crates/onceover-deps", version = "=0.1.3" }
onceover-mines = { path = "crates/onceover-mines", version = "=0.1.3" }
onceover-report = { path = "crates/onceover-report", version = "=0.1.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rustc-hash = "2"
polars = { version = "0.55", default-features = false, features = [
    "temporal",
    "strings",
    "dtype-date",
    "dtype-datetime",
    "dtype-categorical",
    # Narrow integer widths, decimal, struct and fixed-size array
    # Series construction is feature-gated in polars: without these,
    # a frame carrying such a column fails at ingestion with
    # "cannot create series from <dtype>" (issue #75).
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
    "dtype-decimal",
    "dtype-struct",
    "dtype-array",
] }
polars-arrow = { version = "0.55", default-features = false }
pyo3 = { version = "0.29" }
pyo3-polars = { version = "0.28" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package.onceover-mines]
opt-level = 3
