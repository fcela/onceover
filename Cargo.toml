[workspace]
resolver = "2"
members = [
    "crates/onceover",
    "crates/onceover-core",
    "crates/onceover-deps",
    "crates/onceover-mines",
    "crates/onceover-py",
    "crates/onceover-report",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fcela/onceover"
readme = "README.md"

[workspace.dependencies]
onceover = { path = "crates/onceover", version = "=0.1.0" }
onceover-core = { path = "crates/onceover-core", version = "=0.1.0" }
onceover-deps = { path = "crates/onceover-deps", version = "=0.1.0" }
onceover-mines = { path = "crates/onceover-mines", version = "=0.1.0" }
onceover-report = { path = "crates/onceover-report", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rustc-hash = "2"
polars = { version = "0.55", default-features = false, features = [
    "temporal",
    "strings",
    "dtype-date",
    "dtype-datetime",
    "dtype-categorical",
] }
pyo3 = { version = "0.29" }
pyo3-polars = { version = "0.28" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package.onceover-mines]
opt-level = 3
