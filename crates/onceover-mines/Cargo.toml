[package]
name = "onceover-mines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Predictability screening, decision tables, PRISM rules, dependence, dates for onceover"

[dependencies]
onceover-report = { workspace = true }
onceover-core = { workspace = true }
onceover-deps = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
changeforest = "1.2.1"
ndarray = "0.16"
# Not used directly: changeforest 1.2.1 builds against biosphere
# 0.4 on ndarray 0.16; biosphere 0.4.2 moved to ndarray 0.17 and
# no longer compiles with it. The bound keeps the resolution on a
# compatible biosphere until changeforest follows.
biosphere = ">=0.4.0, <0.4.2"

[dev-dependencies]
polars = { workspace = true }
