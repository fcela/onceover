[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "onceover"
version = "0.1.1"
description = "Native Rust data profiling for Polars DataFrames"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["polars>=1.28,<3"]
keywords = ["data-profiling", "polars", "data-quality", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/fcela/onceover"
Issues = "https://github.com/fcela/onceover/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "altair>=6,<7", "vl-convert-python>=1.9", "great_tables>=1.1,<2", "numpy>=2", "nbconvert>=7"]
benchmark = ["numpy>=2", "psutil>=7"]

[tool.maturin]
manifest-path = "crates/onceover-py/Cargo.toml"
python-source = "python"
module-name = "onceover._native"
features = ["pyo3/extension-module"]
include = [
    { path = "tests/**/*.py", format = "sdist" },
    { path = "notebooks/*.ipynb", format = "sdist" },
    { path = "notebooks/*.py", format = "sdist" },
    { path = "benchmarks/*.py", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
