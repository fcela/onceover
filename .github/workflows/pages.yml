name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/configure-pages@v5
      - name: Build and install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.15,<2'
          python -m maturin build --release --locked --out dist --interpreter python
          python -m pip install dist/*.whl -r docs/book/requirements.txt
      - name: Build the book with executed notebooks
        working-directory: docs/book
        env:
          BASE_URL: /onceover
        run: bash build-html.sh
      - name: Check the deployed asset prefix
        working-directory: docs/book
        run: grep -q 'href="/onceover/' _build/html/index.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
