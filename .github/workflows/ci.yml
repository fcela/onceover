name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/release.py check
      - run: python -m pip install pytest
      - run: python -m pytest scripts/test_release.py -q
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  wheels:
    name: Wheel / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.13
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.13
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
            interpreter: python
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            interpreter: python
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            interpreter: python
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --jobs 2 --out dist --interpreter ${{ matrix.platform.interpreter }}
          sccache: true
      - name: Test wheel on Python 3.13
        run: |
          python -m pip install --only-binary=:all: dist/*.whl pytest 'scipy>=1.15'
          python -m pytest tests/ -q
      - name: Execute and render example notebook
        if: matrix.platform.name == 'linux-x86_64'
        run: |
          python -m pip install nbclient nbformat ipykernel 'altair>=6,<7' vl-convert-python 'great_tables>=1.1,<2' nbconvert numpy
          python scripts/check_notebook.py --notebook notebooks/onceover_analysis.ipynb --write
          python scripts/render_notebook.py --notebook notebooks/onceover_analysis.ipynb
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Test minimum Python version
        run: |
          python -m pip install --only-binary=:all: dist/*.whl pytest 'scipy>=1.15'
          python -m pytest tests/ -q
      # Runs on the minimum Python: Polars 1.28 predates Python 3.15,
      # and its Series methods return None there.
      - name: Test wheel on oldest supported Polars
        if: matrix.platform.name == 'linux-x86_64'
        run: |
          python -m pip install --only-binary=:all: dist/*.whl pytest 'scipy>=1.15' 'polars>=1.28,<1.29'
          python -m pytest tests/ -q
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Test latest Python version
        run: |
          python -m pip install --only-binary=:all: dist/*.whl pytest
          python -m pytest tests/ -q
      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  timing:
    name: Timing gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install 'maturin==1.15.0' 'polars>=1.28'
      - run: python -m maturin build --release --locked --out dist --interpreter python
      - run: python -m pip install dist/*.whl
      - run: python benchmarks/timing_gate.py --output timing.json
      - uses: actions/upload-artifact@v6
        with:
          name: timing-gate
          path: timing.json

  gate:
    name: Gate scorecard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install 'maturin==1.15.0'
      - name: Build the head wheel
        run: python -m maturin build --release --locked --out dist-head --interpreter python
      - name: Build the merge-base wheel
        run: |
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add ../base-tree "$BASE_SHA"
          (cd ../base-tree && python -m maturin build --release --locked --out "$GITHUB_WORKSPACE/dist-base" --interpreter python)
      - name: Score both builds
        run: |
          for side in base head; do
            python -m venv "venv-$side"
            "venv-$side/bin/python" -m pip install --only-binary=:all: dist-$side/*.whl 'polars>=1.28' numpy
          done
          venv-base/bin/python benchmarks/gate/run.py --out scorecard-base.json --commit "$BASE_SHA"
          venv-head/bin/python benchmarks/gate/run.py --out scorecard-head.json --commit "${{ github.event.pull_request.head.sha }}"
      - name: Compare
        run: |
          set +e
          python benchmarks/gate/compare.py scorecard-base.json scorecard-head.json --out gate-summary.md
          status=$?
          cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-scorecards
          path: |
            scorecard-base.json
            scorecard-head.json
            gate-summary.md

  # On each push to main: score the build, add the scorecard to the
  # history kept on the gate-history branch, and regenerate the report
  # there (README.md on that branch).
  gate-history:
    name: Gate history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: gate-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install 'maturin==1.15.0'
      - name: Build the wheel
        run: python -m maturin build --release --locked --out dist --interpreter python
      - name: Score the build
        run: |
          python -m pip install --only-binary=:all: dist/*.whl 'polars>=1.28' numpy
          python benchmarks/gate/run.py --out scorecard.json --commit "$GITHUB_SHA"
      - name: Check out the history branch
        run: |
          if git fetch origin gate-history; then
            git worktree add ../history FETCH_HEAD
            git -C ../history switch -C gate-history
          else
            git worktree add --detach ../history
            git -C ../history switch --orphan gate-history
            git -C ../history rm -rfq --ignore-unmatch .
          fi
      - name: Add the entry and render the report
        run: |
          mkdir -p ../history/history
          # First run: start the history from the committed baselines.
          if [ -z "$(ls ../history/history 2>/dev/null)" ]; then
            for f in benchmarks/gate/results/main-*.json; do
              sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['provenance']['commit'])" "$f")
              python benchmarks/gate/report.py add "$f" --history ../history/history \
                --commit "$(git rev-parse "$sha")" --date "$(git log -1 --format=%cI "$sha")" \
                --subject "$(git log -1 --format=%s "$sha")" --accepted none
            done
          fi
          python benchmarks/gate/report.py add scorecard.json --history ../history/history \
            --commit "$GITHUB_SHA" --date "$(git log -1 --format=%cI)" \
            --subject "$(git log -1 --format=%s)"
          python benchmarks/gate/report.py render --history ../history/history --out ../history/README.md
          cat ../history/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push the history branch
        run: |
          cd ../history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md history
          if git diff --cached --quiet; then
            echo "the history already holds this commit"
          else
            git commit -m "Gate report for ${GITHUB_SHA::7}"
            git push origin gate-history
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-scorecard-main
          path: scorecard.json
